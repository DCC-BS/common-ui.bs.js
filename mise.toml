[tools]
# TEMPORARY until 2026-10-29: bun 1.4.4 fixes CVE-2026-111497 (Brotli decoder) but is younger than
# the 7-day cooldown. The weekly dependency routine deletes this comment once 1.4.4 is 7 days old.
bun = "1.4.4"
node = "24.22.1"
usage = "latest"

[hooks]
postinstall = { task = "install" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "install npm packages"
run = [
    "bun install",
    "bunx nuxi prepare",
]

[tasks."nuxt:prepare"]
description = "generate Nuxt types"
run = "bunx nuxi prepare"

# ── Development ───────────────────────────────────────────────────────────────

[tasks.dev]
description = "start the development server"
run = "bunx nuxt dev playground"

# ── Build & Preview ───────────────────────────────────────────────────────────

[tasks.build]
alias = "prepack"
run = "bunx nuxt-module-build build"

# ── Type Checking & Linting ───────────────────────────────────────────────────

[tasks.tsc]
description = "run TypeScript type checking"
run = "bunx vue-tsc --noEmit -p tsconfig.json"

[tasks.lint]
description = "format code with Biome"
run = "bunx biome format --write"

[tasks.check]
description = "check and fix linting issues"
run = "bunx biome check --fix"

[tasks.ci-check]
description = "run type checking, linting"
run = "bunx biome ci ."

# ── Cleanup ───────────────────────────────────────────────────────────────────

[tasks."cleanup:bun"]
description = "cleanup cached files"
run = [
    "rm -rf ./node_modules",
    "bun pm cache rm",
]
